
name: trigger-demo

on:
  push:
    branches:
      - day1
  pull_request:
    branches:
      - day1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from GitHub Actions"

      - name: Print event and ref
        run: echo 'Triggered by: ${{ github.event_name }} on ref ${{ github.ref }}'

      

